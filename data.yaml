# Paper Content Sections
# Sections will be rendered in the order defined below.
# If a section is removed from here, it will automatically disappear from the page and navbar.
sections:
  - id: "abstract"
    title: "Abstract"
    nav_label: "Abstract"
    content: "The Craft Assembly Task - a robotic assembly task inspired by handmade crafts - poses unique challenges relative to a traditional object assembly task. It involves open-ended decisions that are difficult to automate, with previous work relying on prior assumptions or expert knowledge, limiting scalability. In this work, we propose to address these limitations by employing an off-the-shelf Large Language Model (LLM) as the main decision maker in the available objects selection, pose estimation and connectivity between parts without additional training or fine-tuning, using the RGB image of the target object in the wild as a reference. The core of our method is a customized structure for the craft assembly description to constrain the LLM’s predictions. The proposals are validated through collision checks and physics simulation tests. We evaluate our approach on eight types of objects with three possible functions: “hit”, “support” and “rolling”. For visual similarity, we compare our generated final crafts with the 3D models generated by a state-of-the-art image-to-3D generation foundation model, and a baseline that uses image-to-3D part generation model. Our approach produces coherent, physically plausible assemblies, while the baseline often fails to generate or segment the object into parts suitable for assembly."
    components:
      - type: "custom_html"
        title: "Abstract Figure"
        html: |
              <img src="Assets/Fig0.png"
              alt="Abstract figure"
              style="width:100%; max-width:500px; display:block; margin:16px auto; border-radius:10px;" />
      # - type: "youtube_video"
      #   title: "Demo Video"
      #   url: "https://www.youtube.com/embed/n3spw0j8oZs?si=H9psbfyMQi6QWmlo"
      #   description: "Planning and executing the cooking task for a pork rice bowl."

  # - id: "introduction"
  #   title: "Introduction"
  #   nav_label: "Introduction"
  #   content: "TODO: Add Introduction"

  - id: "methodology"
    title: "Methodology"
    nav_label: "Methodology"
    content: "We propose to use off-the-shelf VLMs for planning the Craft Assembly Task, significantly improving robustness for novel inputs compared to our previous method. Corrections to the generated plans, such as format consistency and collisions between parts are applied via rule-based algorithms. The results are validated for stability and functionality via physics simulation. "
    list_type: "bullet" # Options: bullet, number, check, arrow, star, circle, square, none
    list:
      - "8 Object categories: Bus, Truck, Skateboard, Scooter, Table, Chair, Hammer and Bookshelf"
      - "3 Functions: rolling, support and hit"
      - "Custom template of 1 valid craft assembly per object class"
      - "Generated plans are validated for format (syntax parsing) and collision (mesh collision check)"
      - "Final physics simulation validation in Isaac SIM"
    components:
      - type: "image_carousel"
        title: "Steps"
        slides_per_view: 1 # Optional: images shown at once (default 3)
        height: "450px" # Optional: carousel height (default "300px")
        images:
          - "Assets/Fig1.png"
          - "Assets/Fig2.png"
  
  - id: "results"
    title: "Results"
    nav_label: "Results"
    content: "We tested 2 re-prompts strategies: Simply resetting the plan and re-prompt (similar to best-of-N) and Re-prompt with error feedback. Reset and re-prompt outperformed the error feedback version, we believe that once the VLM commits to a plan it does not significantly modify that plan to correct the errors. The majority of errors are caused by collisions between non-connected parts that neither the VLM or our algorithm can solve, mostly caused by choosing parts that do not have enough clearance to fit together. Overall, our method achieves 85% (680/800) of the generated crafts pass all tests, while achieving similar visual similarity to the baseline."
    list_type: "bullet" # Options: bullet, number, check, arrow, star, circle, square, none
    # list:
    #   - "8 Object categories: Bus, Truck, Skateboard, Scooter, Table, Chair, Hammer and Bookshelf"
    #   - "Custom template of 1 valid craft assembly per object class"
    #   - "Generated plans are validated for format (syntax parsing) and collision (mesh collision check)"
    #   - "Final physics simulation validation in Isaac SIM"
    components:
      - type: "image_carousel"
        title: "Qualitative and Quantitative results"
        slides_per_view: 1 # Optional: images shown at once (default 3)
        height: "450px" # Optional: carousel height (default "300px")
        images:
