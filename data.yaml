  - id: "conclusion"
    title: "Conclusion"
    nav_label: "Conclusion"
    content: "Off-the-shelf VLMs can be used for planning the craft assembly task, a complex open-ended problem. However, they still have limitations regarding 3D spatial reasoning which may limit the complexity of the crafts. Nonetheless, this is a step forward in obtaining a more general system capable of abstracting the input for assembly."

